# Runs on every push and pull request. Each job starts from an empty MySQL database,
# so CI also proves that all migrations and the seed work on a fresh install.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w shared -w client
      - run: npm run build

  api:
    name: API tests (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pace_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/pace_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/pace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      # Migrations and seed run in the test setup, against the empty database.
      - run: npm test -w server

  e2e:
    name: Browser tests (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pace_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      s3:
        image: adobe/s3mock:3.12.0
        env:
          initialBuckets: pace-ci
        ports: ['9090:9090']
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/pace_e2e
      APP_URL: http://localhost:5173
      # S3Mock: the same S3 protocol as the Railway bucket, running inside CI.
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_REGION: us-east-1
      S3_BUCKET: pace-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_FORCE_PATH_STYLE: 'true'
      MAIL_FROM: PACE CI <ci@example.invalid>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npm run db:deploy -w server
      - run: npm run db:seed -w server
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
